<article class="recipe-card" [routerLink]="['/recipes', recipe.id]">
  <div class="recipe-img-wrapper">
    @if (recipe.imageUrl) {
      <img [src]="recipe.imageUrl" [alt]="recipe.title" class="recipe-img" />
      <h3 class="recipe-title">{{ recipe.title }}</h3>
    } @else {
      <div class="placeholder-img"></div>
      <h3 class="recipe-title">{{ recipe.title }}</h3>
    }
  </div>

  <div class="recipe-card__content">
    @if (profile?.username) {
      <h4 class="recipe-owner">@{{ profile?.username }}</h4>
    }

    <p class="recipe-card__description">
      {{ recipe.description }}
    </p>

    <div class="recipe-card__meta">
      <span>
        <i class="fa-regular fa-clock"></i>
        {{ recipe.cookingTime }} min
      </span>

      <span>
        <i class="fa-solid fa-user-group"></i>
        {{ recipe.servings }} portioner
      </span>
    </div>

    <div class="recipe-card__tags">
      @for (tag of recipe.tags; track tag) {
        <span class="recipe-card__tag">
          {{ tag }}
        </span>
      }
    </div>
  </div>
</article>
