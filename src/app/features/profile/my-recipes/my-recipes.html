  @if (isLoading()) {
    <p>Loading recipes...</p>
  } @else if (errorMessage()) {
    <div class="alert alert-danger">{{ errorMessage() }}</div>
  } @else if (myRecipes().length === 0) {
    <div class="text-center py-4">
      <i class="fa-solid fa-utensils fa-2x text-muted mb-3"></i>
      <a routerLink="/recipes/new" class="btn btn-outline-primary">Create your first recipe</a>
    </div>
  } @else {
    <div class="recipe-card-grid">
      @for (recipe of myRecipes(); track recipe.id) {
        <div class="recipe-card">
          <a [routerLink]="['/recipes', recipe.id]" class="text-decoration-none text-reset">
            <div class="">
              @if (recipe.imageUrl) {
                <div class="recipe-img-wrapper">
                  <img [src]="recipe.imageUrl" [alt]="recipe.title" class="card-img-top" />
                  <h3 class="recipe-title">{{ recipe.title }}</h3>
                </div>
              } @else {
                <div class="recipe-img-wrapper">
                  <div class="placeholder-img"></div>
                  <h3 class="recipe-title">{{ recipe.title }}</h3>
                </div>
                <!-- <div
                  class="bg-light d-flex align-items-center justify-content-center"
                  style="height: 140px"
                >
                  <i class="fa-solid fa-utensils fa-2x text-muted"></i>
                </div> -->
              }
            </div>
          </a>
        </div>
      }
    </div>
  }
</div>
